<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Mengalihkan...</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .pulse-soft { animation: pulse-soft 1.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen flex items-center justify-center p-4">

  <div class="text-center max-w-md w-full px-6">
    <div id="stateLoading">
      <div class="relative inline-block mb-6">
        <div class="animate-spin rounded-full h-16 w-16 border-4 border-blue-200 border-t-blue-600 mx-auto"></div>
        <div class="absolute inset-0 flex items-center justify-center text-2xl">⭐</div>
      </div>
      <h1 id="statusTitle" class="text-xl font-semibold text-gray-700 mb-2">
        Memuat data kartu...
      </h1>
      <p id="statusMessage" class="text-gray-500 text-sm">
        Mohon tunggu sebentar
      </p>
    </div>

    <div id="stateError" class="hidden">
      <div class="text-6xl mb-4">❌</div>
      <h1 class="text-xl font-bold text-red-600 mb-2">Terjadi Kesalahan</h1>
      <p id="errorMessage" class="text-gray-600 text-sm leading-relaxed"></p>
      <p class="text-gray-400 text-xs mt-4">
        Silakan hubungi admin jika masalah berlanjut.
      </p>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js';

    const DELAY_REDIRECT_ACTIVATE = 800;
    const DELAY_REDIRECT_REVIEW   = 700;

    const stateLoading  = document.getElementById('stateLoading');
    const stateError    = document.getElementById('stateError');
    const statusTitle   = document.getElementById('statusTitle');
    const statusMessage = document.getElementById('statusMessage');
    const errorMessage  = document.getElementById('errorMessage');

    function showError(msg) {
      stateLoading.classList.add('hidden');
      stateError.classList.remove('hidden');
      errorMessage.textContent = msg;
      console.error('[r.html] Error:', msg);
    }

    function setLoading(title, message) {
      statusTitle.textContent = title;
      if (message) statusMessage.textContent = message;
    }

    async function route() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');

      if (!code || code.trim() === '') {
        return showError(
          'Kode kartu tidak ditemukan. Pastikan Anda tap/scan dari kartu resmi.'
        );
      }

      console.log('[r.html] Code detected:', code);

      try {
        const { data, error } = await supabase
          .from('cards')
          .select('card_code, business_name, google_review_url, is_active')
          .eq('card_code', code.trim())
          .maybeSingle();

        if (error) {
          console.error('[r.html] Supabase error:', error);
          return showError('Gagal mengambil data kartu. Silakan coba lagi.');
        }

        if (!data) {
          return showError(
            `Kartu dengan kode "${code}" tidak terdaftar di sistem kami.`
          );
        }

        console.log('[r.html] Card data:', data);

        if (!data.is_active) {
          setLoading(
            '🔓 Kartu belum diaktivasi',
            'Mengalihkan ke halaman aktivasi...'
          );
          setTimeout(() => {
            window.location.replace(
              `activate.html?code=${encodeURIComponent(data.card_code)}`
            );
          }, DELAY_REDIRECT_ACTIVATE);
          return;
        }

        if (!data.google_review_url || data.google_review_url.trim() === '') {
          return showError(
            'Kartu sudah aktif tetapi link Google Review belum diisi. ' +
            'Silakan hubungi pemilik bisnis.'
          );
        }

        setLoading(
          `⭐ Mengalihkan ke ${data.business_name || 'Google Review'}...`,
          'Terima kasih, mohon tunggu sebentar.'
        );

        setTimeout(() => {
          window.location.replace(data.google_review_url);
        }, DELAY_REDIRECT_REVIEW);

      } catch (err) {
        console.error('[r.html] Unexpected error:', err);
        showError('Terjadi kesalahan tidak terduga: ' + (err.message || err));
      }
    }

    route();
  </script>
</body>
</html>
